# OPTIONAL override for `nova dist load`. You don't need this file — nova dist
# has built-in defaults that download the prebuilt nova-load binary from the
# latest release (fast, no compile). Pass it with --resources, or drop it at
# ~/.nova/skypilot/load.yaml. Only the keys you set override the defaults.
#
#   nova dist load configs/loader/test.yaml --resources configs/skypilot/load.yaml --num-jobs 50
#   nova dist load configs/loader/test.yaml --finalize     # after workers finish
#
# This example overrides `setup` to build from a dev branch (the common reason to
# override) — testing un-released code on a fleet. Omit `setup` to keep the
# default prebuilt-binary download; omit `resources` to keep the default cpus.

resources:
  cloud: aws
  cpus: 8+
  use_spot: true
  disk_size: 100

# Build from source on each worker (slow cold compile). Useful for an un-released
# branch; for released code the default download is much faster.
setup: |
  command -v cargo >/dev/null || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
  source "$HOME/.cargo/env"
  cargo install --git https://github.com/qdrant-labs/supernova@my-branch nova-load
  sudo install -m 0755 "$HOME/.cargo/bin/nova-load" /usr/local/bin/nova-load
