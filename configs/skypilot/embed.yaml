# OPTIONAL override for `nova dist embed` — not required (built-in defaults
# install nova-embed from git). Use this to change resources/GPU or pin a ref.
# Copy and tweak.
#
#   nova dist embed configs/embedder/test.yaml --resources configs/skypilot/embed.yaml --num-jobs 50
#
# nova-dist adds the pool wrapper, the staged config, and the per-rank `run:`
# (nova-embed <cfg> --num-jobs N; the rank comes from $SKYPILOT_JOB_RANK).
# You own `resources` and `setup` (how a worker installs nova-embed).

resources:
  cloud: aws
  accelerators: A10G:1
  use_spot: true
  disk_size: 150
  # SkyPilot's region-agnostic GPU image (CUDA preinstalled). Prefer this over a
  # raw AMI id — AMIs are per-region and get deregistered over time.
  image_id: skypilot:gpu-ubuntu-2204

# Install nova-embed on each worker. Pin to a tag/SHA so the fleet runs identical
# code. Adjust the git URL/ref to your fork.
setup: |
  curl -LsSf https://astral.sh/uv/install.sh | sh
  export PATH="$HOME/.local/bin:$PATH"
  uv tool install 'nova-embed[embed] @ git+https://github.com/qdrant-labs/supernova@main#subdirectory=python/nova-embed'

envs:
  HF_HUB_ENABLE_HF_TRANSFER: "1"
