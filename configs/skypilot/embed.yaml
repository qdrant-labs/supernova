# OPTIONAL override for `nova dist embed` — not required (built-in defaults
# install nova-embed from git). Use this to change resources/GPU or pin a ref.
# Copy and tweak.
#
#   nova dist embed configs/embedder/test.yaml --resources configs/skypilot/embed.yaml --num-jobs 50
#
# nova-dist adds the pool wrapper, the staged config, and the per-rank `run:`
# (nova-embed <cfg> --num-jobs N; the rank comes from $SKYPILOT_JOB_RANK).
# You own `resources` and `setup` (how a worker installs nova-embed).

resources:
  cloud: aws
  accelerators: A10G:1
  use_spot: true
  disk_size: 150
  # A real GPU VM AMI (driver + CUDA preinstalled, torch.cuda works). NOT
  # docker:nvidia/cuda — the GPU isn't visible inside that container, so torch
  # falls back to CPU. This alias is catalog-version-specific; if it errors, grep
  # ~/.sky/catalogs/*/aws/images.csv for the current gpu tag.
  image_id: skypilot:custom-gpu-ubuntu-cuda13

# Install nova-embed on each worker. Pin @master to a tag/SHA so the fleet runs
# identical code. Adjust the git URL/ref to your fork.
# Note: UV_TOOL_BIN_DIR puts the `nova-embed` console script directly on PATH so
# the (separate) run shell finds it — `export PATH` here only affects setup.
setup: |
  set -e
  SUDO=""; [ "$(id -u)" -ne 0 ] && SUDO="sudo"
  command -v curl >/dev/null && command -v git >/dev/null || ($SUDO apt-get update && $SUDO apt-get install -y curl git)
  curl -LsSf https://astral.sh/uv/install.sh | sh
  export PATH="$HOME/.local/bin:$PATH"
  UV_TOOL_BIN_DIR="$HOME/.local/bin" uv tool install 'nova-embed[embed] @ git+https://github.com/qdrant-labs/supernova@master#subdirectory=python/nova-embed'
  $SUDO ln -sf "$HOME/.local/bin/nova-embed" /usr/local/bin/nova-embed

envs:
  HF_HUB_ENABLE_HF_TRANSFER: "1"
