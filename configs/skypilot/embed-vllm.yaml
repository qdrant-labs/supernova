# Override for `nova dist embed` runs that use the vllm backend (modality:
# multimodal, or high-throughput text). Copy and tweak.
#
#   nova dist embed configs/embedder/example_multimodal.yaml --resources configs/skypilot/embed-vllm.yaml --num-jobs 8
#
# vLLM is deliberately NOT in the `embed` extra (it's Linux+GPU only and would
# break every CPU/macOS install), so vllm-backend workers must install the
# `[embed,vllm]` extras — that one bracket is the only difference from
# embed.yaml. Installing both extras in one resolve also lets vllm pin the
# torch version consistently with sentence-transformers.

resources:
  cloud: aws
  accelerators: A10G:1
  use_spot: true
  # vLLM + CUDA wheels are several GB on top of the embed stack.
  disk_size: 150
  # A real GPU VM AMI (driver + CUDA preinstalled) — see embed.yaml for why
  # this is not docker:nvidia/cuda.
  image_id: skypilot:custom-gpu-ubuntu-cuda13

# Pin @master to a tag/SHA so the fleet runs identical code.
setup: |
  set -e
  SUDO=""; [ "$(id -u)" -ne 0 ] && SUDO="sudo"
  command -v curl >/dev/null && command -v git >/dev/null || ($SUDO apt-get update && $SUDO apt-get install -y curl git)
  curl -LsSf https://astral.sh/uv/install.sh | sh
  export PATH="$HOME/.local/bin:$PATH"
  UV_TOOL_BIN_DIR="$HOME/.local/bin" uv tool install 'nova-embed[embed,vllm] @ git+https://github.com/qdrant-labs/supernova@master#subdirectory=python/nova-embed'
  $SUDO ln -sf "$HOME/.local/bin/nova-embed" /usr/local/bin/nova-embed

envs:
  HF_HUB_ENABLE_HF_TRANSFER: "1"
