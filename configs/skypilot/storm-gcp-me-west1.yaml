# GCP storm workers in me-west1-a — co-locate with a Qdrant cluster in the same
# region to minimize RTT.
#
#   export QDRANT_URL=http://<qdrant-host>:6334    # nova-storm uses gRPC (6334)
#   export QDRANT_API_KEY=...
#   export QDRANT_COLLECTION=fineweb-10b
#
#   nova dist storm configs/storm/fineweb_bf_k1000_fleet.yaml \
#     --resources configs/skypilot/storm-gcp-me-west1.yaml \
#     --num-jobs 10
#
# storm is REPLICATED: total offered load ≈ num_jobs × concurrency × batch_size.
# With 10 workers × concurrency 16 → ~160 in-flight queries.

resources:
  cloud: gcp
  region: me-west1
  zone: me-west1-a
  cpus: 4+
  use_spot: false
  disk_size: 200

setup: |
  set -e
  if [ -f /cfg/nova-storm-bin ]; then
    sudo install -m 0755 /cfg/nova-storm-bin /usr/local/bin/nova-storm
  else
    command -v cargo >/dev/null || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    . "$HOME/.cargo/env"
    cargo install --git https://github.com/qdrant-labs/supernova --branch fineweb-10b --force nova-storm
    sudo install -m 0755 "$HOME/.cargo/bin/nova-storm" /usr/local/bin/nova-storm
  fi
