source:
  type: huggingface_parquet
  dataset_name: trl-lab/SQaLe_2
  split: train
  text_field: question

dense_embedder:
  type: sentence_transformer
  model: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 128
  dtype: bfloat16

sparse_embedder:                                                                                        
  type: fastembed                                                                                     
  model: Qdrant/bm25                                                                                  
  batch_size: 256

storage:
  type: s3
  s3_bucket: qdrant--vectorforge
  s3_prefix: sqale2/embed-all-MiniLM-L6-v2
  output_dir: /tmp/vectorforge

pipeline:
  chunk_size: 1000
  num_workers: 2
  max_text_length: 8192
  shard_by_rank: true
  row_group_size: 1000
  flush_threshold: 10000