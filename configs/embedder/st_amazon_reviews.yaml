source:
  type: huggingface
  dataset_name: sentence-transformers/amazon-reviews
  split: train
  text_template: "Title: {title}\nReview: {review}"

dense_embedder:
  type: sentence_transformer
  model: Alibaba-NLP/gte-multilingual-base
  trust_remote_code: true
  batch_size: 64
  dtype: bfloat16

pipeline:
  chunk_size: 100000
  num_workers: 2

storage:
  type: s3
  s3_bucket: qdrant---vectorforge
  s3_prefix: amazon-reviews/gte-multilingual-base
  output_dir: /tmp/vectorforge
