source:
  type: huggingface
  dataset_name: mteb/tweet_sentiment_extraction
  split: train
  text_field: text

embedder:
  type: openai
  model: text-embedding-3-small
  dimensions: 1536

pipeline:
  chunk_size: 10000
  num_workers: 4

storage:
  type: s3
  s3_bucket: qdrant---vectorforge
  s3_prefix: mteb--tweet-sentiment/openai-3-small
  output_dir: /tmp/vectorforge
