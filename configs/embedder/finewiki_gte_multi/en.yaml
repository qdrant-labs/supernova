source:
  type: huggingface
  dataset_name: HuggingFaceFW/finewiki
  split: train
  config: "en"
  text_template: "Title: {title}\nText: {text}"

embedder:
  type: sentence_transformer
  model: Alibaba-NLP/gte-multilingual-base
  trust_remote_code: true
  batch_size: 64
  dtype: bfloat16

storage:
  type: s3
  s3_bucket: qdrant---vectorforge
  s3_prefix: finewiki/gte-multilingual-base
  output_dir: /tmp/vectorforge

pipeline:
  chunk_size: 100000
  num_workers: 2
  max_text_length: 81,920 # 10X the default max length of 8,192 for gte-multilingual-base