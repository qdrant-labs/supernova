source:
  type: huggingface_parquet         # file-level sharded; bypasses HF streaming's broken .skip() for huge datasets
  dataset_name: HuggingFaceTB/dclm-edu
  split: train
  text_template: '{text}'
  total_rows_override: 1000856429   # skip the metadata sweep at total-rows query time; per-file counts still read for slicing

dense_embedder:
  type: sentence_transformer
  model: Alibaba-NLP/gte-multilingual-base
  trust_remote_code: true
  batch_size: 64
  dtype: bfloat16
  max_tokens: 512
  truncate: true

pipeline:
  chunk_size: 10000 # chunk size for processing the dataset in batches
  num_workers: 2
  shard_by_rank: true
  rendered_text_column: rendered_text

storage:
  type: s3
  s3_bucket: qdrant--vectorforge
  s3_prefix: huggingface-tb--dclm-edu/embed-gte-multilingual-base
  output_dir: /tmp/vectorforge