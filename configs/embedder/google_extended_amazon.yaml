source:
  type: huggingface
  dataset_name: google/extended_amazon_2023_dataset
  split: train
  text_template: "Title: {title_to_display}\n\nReview: {description_to_display}"

dense_embedder:
  type: sentence_transformer
  model: Alibaba-NLP/gte-multilingual-base
  trust_remote_code: true
  batch_size: 64
  dtype: bfloat16

pipeline:
  chunk_size: 100000
  num_workers: 2

storage:
  type: s3
  s3_bucket: qdrant---vectorforge
  s3_prefix: arxiv-papers/gte-multilingual-base
  output_dir: /tmp/vectorforge
