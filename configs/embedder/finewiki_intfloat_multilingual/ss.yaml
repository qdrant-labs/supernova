source:
  type: huggingface
  dataset_name: HuggingFaceFW/finewiki
  split: train
  config: "ss"
  text_template: "Title: {title}\nText: {text}"

dense_embedder:
  type: sentence_transformer
  model: intfloat/multilingual-e5-large
  trust_remote_code: true
  batch_size: 64
  dtype: bfloat16
  max_tokens: 512
  truncate: true

storage:
  type: s3
  s3_bucket: qdrant--vectorforge
  s3_prefix: finewiki/embed-multilingual-e5-large/ss
  output_dir: /tmp/vectorforge

pipeline:
  chunk_size: 1000
  num_workers: 2
  max_text_length: 8192
