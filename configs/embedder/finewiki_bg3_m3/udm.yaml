source:
  type: huggingface
  dataset_name: HuggingFaceFW/finewiki
  split: train
  config: "udm"
  text_template: "Title: {title}\nText: {text}"

multivector_embedder:
  type: bge_m3
  model: BAAI/bge-m3
  batch_size: 64
  dtype: bfloat16
  max_tokens: 768
  truncate: true
  pooling:
    type: mean
    normalize: true
    pooled_column_name: dense_embedding

storage:
  type: s3
  s3_bucket: qdrant--vectorforge
  s3_prefix: finewiki/embed-bge-m3/udm
  output_dir: /tmp/vectorforge

pipeline:
  chunk_size: 1000
  num_workers: 2
  max_text_length: 8192
