source:
  type: huggingface_parquet
  dataset_name: HuggingFaceFW/finewiki
  split: train
  path_filter: "data/cebwiki/*"
  text_template: "Title: {title}\nText: {text}"

dense_embedder:
  type: sentence_transformer
  model: Alibaba-NLP/gte-multilingual-base
  trust_remote_code: true
  batch_size: 64
  dtype: bfloat16
  max_tokens: 768
  truncate: true

storage:
  type: s3
  s3_bucket: qdrant--vectorforge
  s3_prefix: finewiki/embed-gte-multilingual-base/ceb
  output_dir: /tmp/vectorforge

pipeline:
  chunk_size: 1000
  num_workers: 2
  max_text_length: 8192
  shard_by_rank: true
