source:
  type: huggingface_parquet
  dataset_name: mteb/tweet_sentiment_extraction
  split: train
  # Sources are pure row producers — WHAT gets embedded is declared per
  # embedder entry below (input_column). Derived columns are available via:
  # render_columns:
  #   combined: "{title}: {abstract}"

# Each entry declares its own axes:
#   kind          — output shape: dense | sparse | multivector (drives the
#                   parquet column type and the manifest)
#   type          — backend implementation (registry lookup is (kind, type))
#   modality      — how input_column's values are decoded: text | image.
#                   REQUIRED, no default: embedding the wrong modality for
#                   hours costs more than typing `modality: text`.
#   input_column  — source column this entry embeds
#   output_column — parquet column for the result (default: "{name}_embedding")
# Unknown keys (batch_size, dtype, device, …) pass through to the backend.
embedders:
  - name: minilm_l6
    kind: dense
    type: sentence_transformer
    model: sentence-transformers/all-MiniLM-L6-v2
    input_column: text
    modality: text
    batch_size: 128
    dtype: bfloat16
    # max_length: 8192          # truncate input to N chars before embedding
  
  - name: minilm_l12
    kind: dense
    type: sentence_transformer
    model: sentence-transformers/all-MiniLM-L12-v2
    input_column: text
    modality: text
    batch_size: 128
    dtype: bfloat16
    # max_length: 8192          # truncate input to N chars before embedding

  - name: bm25
    kind: sparse
    type: fastembed
    model: Qdrant/bm25
    input_column: text
    modality: text
    batch_size: 256

  # Same column through several models (comparison runs), or different columns
  # through different models (e.g. CLIP on an image column), are both just more
  # entries. Entries pointing at the same multi-head model and input column
  # (e.g. dense + sparse + multivector on bge_m3) are automatically fused into
  # one forward pass — see example_fused.yaml.
  #
  # - name: clip
  #   kind: dense
  #   type: sentence_transformer
  #   model: clip-ViT-B-32
  #   input_column: image
  #   modality: image
  #
  # - name: colbert
  #   kind: multivector
  #   type: bge_m3
  #   model: BAAI/bge-m3
  #   input_column: text
  #   modality: text
  #   batch_size: 8
  #   pooling:                  # derive a dense column from the multivector
  #     type: mean              # mean | max | cls | last
  #     normalize: true
  #     # output_column: dense_pooled   (default: "{name}_pooled")

# How the input column's text is split into pieces BEFORE embedding.
# Model-agnostic: every entry reading that column receives the same pieces.
# Omit for the default (passthrough = no split). A splitting strategy requires
# a single input_column across all entries — splitting one column while another
# entry reads a different one produces inconsistent row counts and errors at
# launch.
# chunking:
#   strategy: fixed_char    # split into fixed-size CHARACTER windows
#   chunk_chars: 1024
#   overlap: 0

# storage:
#   type: object_store                 # s3 / gcs / azure + s3-compatible, via a URI
#   path: s3://qdrant--vectorforge/mteb_tweets/all-MiniLM-L6-v2  # or gs://… , az://…
#   # endpoint: https://<acct>.r2.cloudflarestorage.com   # for R2/B2/MinIO/Spaces
#   # region: auto
#   # legacy s3 shape (still supported): type: s3 + bucket + prefix

storage:
  type: local
  output_dir: /tmp/mteb_tweets_all-MiniLM-L6-v2

pipeline:
  flush_threshold: 10000
  # What to do when a row's input column is empty:
  #   skip (default) — drop the row; counted in the manifest, warned if >1%
  #   null           — keep the row, write a null embedding
  #   error          — abort on the first empty input
  # on_empty_input: skip
  #
  # Opt-in output layout (composable; both recorded in the manifest, which
  # also lists every file a rank wrote under "output_files"):
  # content_addressed_files: true  # name parquets by a content-derived uuid
  #                                # instead of rank/batch counters
  # shard_output_buckets: 256      # spread files across 000/..255/ subdirs,
  #                                # bucket picked by content hash (uniform,
  #                                # no cross-rank coordination)
