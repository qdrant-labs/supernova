source:
  type: huggingface_parquet
  dataset_name: mteb/tweet_sentiment_extraction
  split: train
  text_field: text

dense_embedder:
  type: sentence_transformer
  model: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 128
  dtype: bfloat16

sparse_embedder:
  type: fastembed
  model: Qdrant/bm25
  batch_size: 256

# multivector_embedder:
#   type: bge_m3
#   model: BAAI/bge-m3
#   batch_size: 8

# How each row's text is split into pieces BEFORE embedding. Model-agnostic:
# every embedder above receives the same pieces. Omit for the default
# (passthrough = no split; each model truncates overflow at its own token limit).
# chunking:
#   strategy: fixed_char    # split into fixed-size CHARACTER windows
#   chunk_chars: 1024
#   overlap: 0
#   # strategy: passthrough  # no-op (default)
#   # strategy: semantic     # not implemented yet (issue #13)

# storage:
#   type: object_store                 # s3 / gcs / azure + s3-compatible, via a URI
#   path: s3://qdrant--vectorforge/mteb_tweets/all-MiniLM-L6-v2  # or gs://… , az://…
#   # endpoint: https://<acct>.r2.cloudflarestorage.com   # for R2/B2/MinIO/Spaces
#   # region: auto
#   # legacy s3 shape (still supported): type: s3 + bucket + prefix

storage:
  type: local
  output_dir: /tmp/mteb_tweets_all-MiniLM-L6-v2

pipeline:
  chunk_size: 1000
  flush_threshold: 10000