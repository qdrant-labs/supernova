vectors:
  dense:
    type: dense
    column: dense_embedding
    distance: cosine
  colbert:
    type: multivector
    column: multivector_embedding
    distance: cosine
    comparator: max_sim

datasource:
  type: s3
  s3_bucket: qdrant--vectorforge
  s3_prefix: finewiki/embed-bge-m3
  payload_fields:
    text: rendered_text
    title: title
    url: url
    language: language

vectorstore:
  type: qdrant
  collection_name: finewiki-bge-m3
  url: ${QDRANT_URL}
  api_key: ${QDRANT_API_KEY}

loader:
  batch_size: 1000
  prefetch_size: 50000
  concurrency: 8
