dispatch:
  num_shards: 10
  run_name: ccnews-bge-large

resources:
  cpus: 2
  memory: 16
  cloud: aws

vectors:
  dense:
    type: dense
    column: dense_embedding
    distance: cosine

datasource:
  type: s3
  s3_bucket: qdrant--vectorforge
  s3_prefix: stanford-oval--ccnews/baai_bge_large_en_v1.5
  id_expression: "hash(text)"   # content-deduped point ids; collapses ~2x article republishes
  payload_fields:
    text: text
    title: title
    url: requested_url
    published_date: published_date

vectorstore:
  type: qdrant
  collection_name: ccnews-bge-large
  url: ${QDRANT_URL}
  api_key: ${QDRANT_API_KEY}

loader:
  batch_size: 1000
  prefetch_size: 25000   # ~9 KiB/row × 25k = ~225 MiB chunk; safe on 8 GiB workers
  concurrency: 8
