# Load config for the `nova-load` binary:
#   nova-load configs/loader/test.yaml
# For distributed loading, shard the corpus across jobs with CLI flags:
#   nova-load configs/loader/test.yaml --num-jobs 25 --job-rank $SKYPILOT_JOB_RANK
# If a worker dies mid-load, rerun it with --continue to resume where it
# stopped (probes the store for its slice's progress; safe to pass on every
# rank, even finished ones — see docs/loading "Resuming an interrupted load").
# (workers should also pass --no-manage-indexing so only the master creates the
# collection). Resources/dispatch are an orchestration concern now, not part of
# this file — the loader rejects unknown top-level keys.

# datasource:
#   type: s3
#   path: s3://qdrant--vectorforge/mteb_tweets/all-MiniLM-L6-v2
#   id_expression: "vf_point_id(filename, file_row_number)"
#   payload_fields:
#     text: text
#     label: label
#     label_text: label_text
#     tweet_id: id

datasource:
  type: local
  path: /tmp/mteb_tweets_all-MiniLM-L6-v2
  id_expression: "vf_point_id(filename, file_row_number)"
  # Each payload_fields VALUE is a DuckDB SQL expression evaluated per row during
  # the upsert read (the KEY is the payload field name). A bare column name like
  # `text` is just the trivial expression "that column" — but you can use any
  # scalar expression: transform columns, derive values, or generate synthetic
  # payloads from scratch. Available helpers (see register_macros): `filename`,
  # `file_row_number`, `random_choice(list)`, `random_word()`, `random_words(n)`.
  # Return a scalar (string/int/float/bool); a LIST/STRUCT expression lands as
  # null, so index into lists to get a scalar.
  payload_fields:
    text: text                                  # plain column
    label: label
    label_text: label_text
    tweet_id: id
    # --- synthetic examples (uncomment to try) ---
    # label_upper: "upper(label_text)"          # transform a column
    # rand_score: "random()"                    # synthetic float in [0,1)
    # rand_rank: "(random() * 1000)::int"       # synthetic int
    # category: "random_choice(['a','b','c'])"  # sample from a set
    # title: "random_words(5)"                  # synthetic 5-word phrase
    # ingested_at: "now()"                       # constant/derived

vectors:
  dense:
    type: dense
    column: dense_embedding
    distance: cosine
  # sparse:
  #   type: sparse
  #   column: sparse_embedding

vectorstore:
  type: qdrant
  collection_name: mteb_tweets_all-MiniLM-L6-v2
  url: ${QDRANT_URL}
  api_key: ${QDRANT_API_KEY}
  upsert_wait: false
  # Per-request / connect timeouts in seconds (defaults 120 / 10). The client's
  # own default is 5s — too short for upserts into a loaded cluster (the server
  # still applies the write; the retry re-sends it). Raise under backpressure.
  # timeout_s: 300
  # connect_timeout_s: 10
  # --- custom (user-defined) sharding, Qdrant-only (uncomment to try) ---
  # `shard_key` is a DuckDB expression evaluated per row, in the same context
  # as payload_fields (source columns, filename, file_row_number, macros). It
  # must return a string or non-negative integer, and must be deterministic —
  # Qdrant does not dedupe ids across shard keys, so a key that changes
  # between runs duplicates points. Keys are created lazily as workers first
  # upsert under them (never a DISTINCT scan); `pre_create` is an explicit
  # list created at prepare time. NOTE: with custom sharding,
  # params.shard_number means shards PER KEY (total = keys × shards × replicas).
  # custom_sharding:
  #   shard_key: "label"                           # plain column → keyword keys
  #   # shard_key: "strftime(created_at, '%Y-%m')" # time buckets
  #   # shard_key: "hash(id) % 16"                 # bounded hash → number keys
  #   # shard_key: "file_row_number % 100"         # perfectly balanced slices
  #   # shards_number: 2                           # per-key physical shards
  #   # replication_factor: 2                      # per-key replicas
  #   # pre_create: [tenant_a, tenant_b]           # create up front in `prepare`

# Other backends are compiled in only with the matching cargo feature:
#   cargo build -p nova-load --features elastic,milvus
#
# Elasticsearch (feature `elastic`) — dense vectors + payload. Sparse/multivector
# are not supported. Auth: username/password OR a base64 api_key.
# vectorstore:
#   type: elastic
#   url: http://localhost:9200         # https:// (default ES 8) → also set tls_insecure: true
#   index_name: mteb_tweets
#   username: elastic
#   password: ${ELASTIC_PASSWORD}  # alternative to api_key
#   # api_key: ${ELASTIC_API_KEY}        # alternative to username/password
#   tls_insecure: true
#   recreate: false
#
# Milvus (feature `milvus`) — dense vectors + id ONLY (the SDK has no JSON field,
# so payload is NOT persisted). varchar primary key, so UUID ids work.
# vectorstore:
#   type: milvus
#   url: http://localhost:19530
#   collection_name: mteb_tweets
#   # username: root
#   # password: ${MILVUS_PASSWORD}
#   recreate: false

loader:
  batch_size: 256
  concurrency: 4
  # Per-WORKER upsert ceiling (points/sec; unset = unlimited). An upper bound,
  # not a target. A fleet of N workers presents N× this to the store — the
  # startup log prints that fleet-wide figure.
  # max_points_per_sec: 5000