datasource:
  type: s3
  bucket: qdrant--vectorforge
  prefix: arxiv-papers/embedder-bge-large-en-v1.5/
  id_expression: "vf_point_id(filename, file_row_number)"
  payload_fields:
    rendered_text: rendered_text
    arxiv_id: arxiv_id
    title: title
    authors: authors
    submission_date: submission_date
    comments: comments
    primary_subject: primary_subject
    subjects: subjects
    doi: doi
    abstract: abstract
    file_path: file_path
    
  
vectors:
  dense:
    type: dense
    column: dense_embedding
    distance: cosine
  sparse:
    type: sparse
    column: sparse_embedding

vectorstore:
  type: qdrant
  collection_name: arxiv_papers_embedder_bge_large_en_v1_5
  url: ${QDRANT_URL}
  api_key: ${QDRANT_API_KEY}

loader:
  batch_size: 256
  concurrency: 4