dispatch:
  num_shards: 10
  run_name: finewiki-gte-multilingual

resources:
  cpus: 2
  memory: 16
  cloud: aws

vectors:
  dense:
    type: dense
    column: dense_embedding
    distance: cosine
  sparse:
    type: sparse
    column: sparse_embedding

datasource:
  type: s3
  s3_bucket: qdrant--vectorforge
  s3_prefix: finewiki/embed-gte-multilingual-base/
  id_expression: "hash(text)"   # stable content-based IDs
  prefetch: true
  payload_fields:
    text: text
    title: title
    url: url
    wikidata_id: wikidata_id
    in_language: in_language
    date_modified: date_modified
    has_math: has_math

vectorstore:
  type: qdrant
  collection_name: finewiki-gte-multilingual-base-en
  url: ${QDRANT_URL}
  api_key: ${QDRANT_API_KEY}
 
loader:
  batch_size: 256
  concurrency: 4