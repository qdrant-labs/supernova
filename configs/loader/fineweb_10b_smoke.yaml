# FineWeb 10B smoke-test ingest config (3-node validation run).
#
# Run:
#   nova load inspect configs/loader/fineweb_10b_smoke.yaml --num-jobs 1 --job-rank 0
#   nova dist load configs/loader/fineweb_10b_smoke.yaml --num-jobs 3
#   nova dist load configs/loader/fineweb_10b_smoke.yaml --finalize
#
# Notes:
# - Keep file_list small (3-20 files) for a quick smoke test.
# - file_list entries are keys relative to datasource.path.

datasource:
  type: s3
  path: s3://fineweb-gte-with-payloads/resharded/
  download_timeout_secs: 600
  id_expression: "vf_point_id(filename, file_row_number)"
  file_list:
    - train-part0__0047.parquet
  payload_fields:
    id: id
    text: text
    url: url
    dump: dump
    date: date
    language: language
    language_score: language_score
    token_count: token_count

vectors:
  dense:
    type: dense
    column: dense_embedding
    distance: cosine
    size: 768
    datatype: float16

vectorstore:
  type: qdrant
  collection_name: fineweb_gte_10b_smoke
  url: ${QDRANT_URL}
  api_key: ${QDRANT_API_KEY}
  upsert_wait: false
  params:
    recreate: false
    on_disk_payload: true
    hnsw:
      m: 16
      ef_construct: 100
      on_disk: true
    optimizers:
      indexing_threshold: 0
      max_segment_size_kb: 3840000
      flush_interval_sec: 5

loader:
  batch_size: 256
  concurrency: 4
  file_look_ahead: 1
  file_retries: 5
  upsert_retries: 5
  max_failed_files: 2
