# Example: load pre-embedded data from a HuggingFace dataset repo into Qdrant.
#
# The HF repo is expected to follow the convention vectorforge writes:
#   hf://datasets/{namespace}/{name}/data/...                 corpus parquets
#   hf://datasets/{namespace}/{name}/eval/queries_*.parquet   eval artifacts
#
# Set HF_TOKEN in the environment if the repo is private (the loader's DuckDB
# secret + HfApi will both pick it up).

dispatch:
  num_shards: 4
  run_name: example-hf-load

resources:
  cpus: 2
  memory: 16
  cloud: aws

vectors:
  dense:
    type: dense
    column: dense_embedding
    distance: cosine

datasource:
  type: huggingface
  repo_id: my-namespace/my-embedded-dataset   # change me
  # subdir: ""   # optional sub-path under data/ for partial corpora
  id_expression: "vf_point_id(filename, file_row_number)"
  payload_fields:
    text: rendered_text

vectorstore:
  type: qdrant
  collection_name: example-hf-load
  url: ${QDRANT_URL}
  api_key: ${QDRANT_API_KEY}

loader:
  batch_size: 256
  concurrency: 4