  payload_fields:
    id: id
    text: text
    url: url
    dump: dump
    date: date
    language: language
    language_score: language_score
    token_count: token_count

vectors:
  dense:
    type: dense
    column: dense_embedding
    distance: cosine
    size: 768
    datatype: float16

vectorstore:
  type: qdrant
  collection_name: fineweb_gte_300m_probe
  url: ${QDRANT_URL}
  api_key: ${QDRANT_API_KEY}
  upsert_wait: false
  params:
    recreate: true
    shard_number: 12
    on_disk_payload: true
    hnsw:
      m: 16
      ef_construct: 100
      on_disk: false
    quantization:
      type: turbo
      bits: 4
      always_ram: true
    payload_indexes:
      mode: specific
      fields:
        - id
        - text
        - url
        - dump
        - date
        - language
        - language_score
        - token_count
      field_types:
        id: keyword
        text: text
        url: keyword
        dump: keyword
        date: keyword
        language: keyword
        language_score: float
        token_count: integer
    optimizers:
      indexing_threshold: 0
      max_segment_size_kb: 2097152
      flush_interval_sec: 5

loader:
  batch_size: 256
  concurrency: 6
  file_look_ahead: 2
  file_retries: 5
  upsert_retries: 5
  max_failed_files: 3
