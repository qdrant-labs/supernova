datasource:
  type: s3
  bucket: qdrant--vectorforge
  prefix: mteb_tweets/all-MiniLM-L6-v2
  id_expression: "vf_point_id(filename, file_row_number)"
  prefetch: true
  payload_fields:
    text: text
    label: label
    label_text: label_text
    tweet_id: id

vectors:
  dense:
    type: dense
    column: dense_embedding
    distance: cosine
  sparse:
    type: sparse
    column: sparse_embedding

vectorstore:
  type: qdrant
  collection_name: mteb_tweets_all-MiniLM-L6-v2
  url: ${QDRANT_URL}
  api_key: ${QDRANT_API_KEY}
  # params:
  #   shard_number: 12
  #   replication_factor: 2
  #   recreate: false   # if the collection already exists with different shard/
  #                     # replication/vector params, the load errors (those are
  #                     # immutable after creation). Set true to drop + recreate.

loader:
  batch_size: 256
  concurrency: 4
  # wps: 2000     # optional target writes (points) per second PER WORKER. Set it
                  # to pace upserts at a fixed rate; omit / 0 for max throughput.
                  # Fleet target = num_jobs × wps.

resources:
  cpus: 2
  memory: 16
  cloud: aws

dispatch:
  num_shards: 25
  run_name: fineweb-bge-large-bm25