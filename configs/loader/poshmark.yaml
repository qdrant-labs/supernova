datasource:
  type: s3
  bucket: poshmark-benchmark
  prefix: listings_90_days_may_4_with_lattice_embeddings_spark_method
  id_expression: vf_point_id(filename, file_row_number)
  prefetch: true
  prefetch_dir: /tmp/vectorforge_loader
  payload_fields:
    listing_id: listing_id
    department_id: department_id
    category_id: category_id
    sub_category_ids: sub_category_ids
    size_ids: size_ids
    brand_id: brand_id
    creator_id: creator_id
    price: price
    created_at: created_at
    domain: domain

vectors:
  dense:
    type: dense
    column: embedding
    distance: cosine

vectorstore:
  type: qdrant
  collection_name: products
  url: ${QDRANT_URL}
  api_key: ${QDRANT_API_KEY}
  params:
    upsert_wait: false

loader:
  batch_size: 512
  concurrency: 4
  
dispatch:
  num_shards: 10
  run_name: poshmark_benchmark

resources:
  cpus: 2
  memory: 16
  cloud: aws