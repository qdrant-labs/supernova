# Brute-force ground truth for `nova bf`:
#   nova bf compute configs/brute_force/example.yaml                     # 1 GPU
#   nova dist bf compute configs/brute_force/example.yaml --num-jobs 8   # fleet
#   nova bf merge   configs/brute_force/example.yaml                     # combine partials
#
# Output: {output.path}/bf_<queries-stem>_<name>_k<K>.parquet with
#   query_id, <payload_fields...>, hit_ids (list[str]), hit_scores (list[float]).
# Every other knob (I/O, batch sizes, two-pass, merge tuning) has a sensible
# default; see docs/brute-force/overview.md#performance.

corpus:
  path: s3://my-bucket/corpus/          # parquet file or directory
  dense_column: dense_embedding
  # sparse_column: sparse_embedding     # for vector_type: sparse
  # multivector_column: multivector_embedding   # for vector_type: multivector
  # id_column: id                       # omit: ids match nova-load's point ids

queries:
  path: s3://my-bucket/queries.parquet
  dense_column: dense_embedding
  # id_column: query_id                 # omit: derived from file + row
  payload_fields: [text]                # query columns copied into the output

output:
  path: s3://my-bucket/eval/            # must be shared (s3://) for a fleet run

params:
  # Fleet runs: ranks share their running top-k thresholds so each prunes
  # harder, and drop entries that cannot win so the merge reads less. Exact.
  # Off by itself on a single worker; needs the shared output.path above.
  threshold_exchange: true
  trim_partials: true                   # only used with threshold_exchange
  # Which of two exactly tied hits wins: ordinal (earlier corpus row, free) or
  # id (lower corpus.id_column, survives re-sharding the corpus).
  tiebreak: ordinal
  two_pass: auto                        # exact pruning; `off` = plain fp32 scoring

searches:                               # all searches share one corpus scan
  - name: dense                         # optional; goes into the output filename
    vector_type: dense                  # dense | sparse | multivector
    metric: cosine                      # cosine | dot | euclidean
    k: 1000
    # filter:                           # Qdrant-style: must / should / must_not
    #   must:
    #     - field: language
    #       match: eng
    #     - field: cost
    #       range: {lt: 10}
    # rows: {column: query_set, isin: [dense]}   # only these query rows
