# Brute-force ground-truth config for `nova bf`:
#   nova bf compute configs/brute_force/example.yaml                 # 1 GPU
#   nova dist bf compute configs/brute_force/example.yaml --num-jobs 8   # fleet
#   nova bf merge   configs/brute_force/example.yaml                 # combine partials
#
# Output: {output.path}/bf_<queries-stem>_k<K>.parquet with columns
#   query_id (str), <carried payload...>, hit_ids (list[str]), hit_scores (list[float])
# Sanity check: if a query is also in the corpus, its top hit is itself (score ~1.0).

corpus:
  # The embedded parquets to search over (same files the loader ingests).
  path: s3://qdrant--vectorforge/fiqa/bge-m3
  dense_column: dense_embedding
  # Use an already-unique column for hit_ids — transparent for public data (e.g.
  # fineweb's `id` = "<urn:uuid:...>") and resolvable without the loader's hashing.
  # Omit to derive make_point_id(corpus_file, row), matching the point ids the
  # loader synthesizes at ingest. A real id column is read alongside the dense
  # vectors and kept in RAM per file for this worker's slice of the corpus
  # (budget ~ slice_rows × id_size of host memory).
  # id_column: id

queries:
  # Query embeddings (a parquet file or a dir of them).
  path: s3://qdrant--vectorforge/fiqa/bge-m3/queries.parquet
  dense_column: dense_embedding
  # Use an existing column as the query id; omit to derive make_point_id(file, row).
  # id_column: query_id
  # Columns to carry from the queries file into each output row.
  payload_fields:
    - text

output:
  path: s3://qdrant--vectorforge/fiqa/bge-m3/eval

params:
  k: 1000
  metric: cosine          # cosine | dot | euclidean
  # Score each corpus file against the queries in row-batches of this many rows
  # instead of all at once, bounding the (n_queries × rows) score matrix on the
  # GPU. Omit (default) to score the whole file in one matmul — fastest, and fine
  # until a file is big enough (or the query set large enough) to OOM the GPU.
  # Values below k are raised to k (a smaller batch can't fill the top-K).
  # corpus_batch_size: 4096

# Restrict eligible neighbors to corpus rows matching this predicate — shaped
# like a Qdrant filter (must = AND, should = OR-at-least-one, must_not = AND-NOT).
# A condition's `field` is the only place you name a corpus column to filter on
# — `compute` reads exactly (and only) the columns referenced here.
# filter:
#   must:
#     - field: language
#       match: eng            # scalar = equality; a list matches any of them
#     - field: cost
#       range: {lt: 10}       # gt/gte/lt/lte, combinable in one condition
