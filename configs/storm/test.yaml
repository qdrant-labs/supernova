# Example `nova storm` config — load-test a Qdrant collection.
#
#   nova storm        configs/storm/test.yaml          # local smoke test
#   nova storm-dist   configs/storm/test.yaml           # replicated fleet (in-region)

# The cluster under test.
target:
  type: qdrant
  url: ${QDRANT_URL}
  api_key: ${QDRANT_API_KEY}
  collection_name: products

# What to query with.
query:
  vector_name: dense          # which named vector to search
  top_k: 10
  source:
    # Query vectors — ideally the parquet produced by `nova generate-queries`.
    uri: s3://qdrant--vectorforge/queries/poshmark_1000.parquet
    column: embedding
    limit: 1000               # how many query vectors to cycle through
  # Optional payload filter applied to every query. The shape is vendor-native —
  # this is a Qdrant filter, parsed 1:1 into models.Filter. Omit for no filter.
  # filter:
  #   must:
  #     - key: category
  #       match:
  #         value: electronics

# Load profile — applied PER WORKER and replicated across the fleet, so total
# offered load is roughly num_workers × {concurrency or qps} (NOT sharded).
load:
  concurrency: 8                # closed-loop: in-flight held per worker.
                                # paced (qps set): in-flight ceiling / safety cap.
  duration_s: 300               # how long to keep the load going
  # optional target queries/sec PER WORKER. Set it to
  qps: 75                   
                                # pace at a fixed offered rate (open-loop); omit / 0
                                # to measure max throughput at the concurrency above.
                                # Fleet target = num_workers × qps.

# Where measurements go. Omit / leave commented for stdout — the local-first
# default, no DB needed. Uncomment to stream to Postgres (local Timescale or
# Neon) for live Grafana; storm-dist forwards ${SN_METRICS_DB_URL} to workers
# automatically because it's referenced here.
metrics:
  type: postgres
  dsn: ${SN_METRICS_DB_URL}

# Consumed by `storm-dist`.
dispatch:
  num_workers: 4

# Handed straight to SkyPilot. Keep `region` matching the cluster + bucket.
# storm-dist defaults to on-demand regardless (spot preemption skews results).
resources:
  cpus: 4
  memory: 8
  cloud: aws
  region: us-east-1