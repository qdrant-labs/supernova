# Load-test config for `nova storm` — fire nearest-neighbour queries at a vector
# store and measure latency/throughput under a controlled load shape.
#
#   nova storm configs/storm/example.yaml
#
# Distributed: work is REPLICATED, not sharded — every worker runs this same
# profile, so total offered load ≈ num_jobs × (concurrency or rps) × batch_size.
#   nova dist storm configs/storm/example.yaml --num-jobs 10
#
# Prints a latency summary (requests, errors, throughput, p50/p95/p99, max).

# The cluster under test, dispatched on `type` — `qdrant` (always available),
# or `milvus` / `elastic` (feature-gated: build with `--features elastic,milvus`).
target:
  type: qdrant
  url: ${QDRANT_URL}                # env substitution; ${VAR:-default} also works
  api_key: ${QDRANT_API_KEY}
  collection_name: fiqa_bge-m3

  # --- Or one of the other backends (replace the `qdrant` block above). For
  # milvus/elastic, `query.vector_name` is REQUIRED (the vector field to search)
  # and `query.filter` is NOT yet supported (qdrant only).
  #
  # type: milvus
  # url: http://localhost:19530       # gRPC + REST share this endpoint (2.4+)
  # collection_name: fiqa_bge-m3
  # username: root                    # optional — set both or neither; env
  # password: my-password             #   substitution works here too, as above
  #   NOTE: a COSINE collection is queried over REST (the Rust SDK has no native
  #   cosine metric) — slower than the SDK path used for L2/IP; a warning is
  #   logged. Payload isn't persisted by the milvus loader, so `with_payload`
  #   has no effect here.
  #
  # type: elastic
  # url: https://localhost:9200
  # index_name: fiqa_bge-m3
  # username: elastic                 # or `api_key: <base64 id:api_key>`; optional
  # password: my-password
  # tls_insecure: false               # true only for a self-signed dev node

# What to search with.
query:
  # Named vector to hit. Omit for a single-(unnamed-)vector Qdrant collection;
  # REQUIRED for milvus (the annsField) and elastic (the dense_vector field).
  vector_name: dense
  top_k: 10                         # neighbours per query (default 10)
  # A ground truth DEEPER than top_k is truncated to its first top_k ids at
  # load (the list is best-first, so the prefix is the true top-k) — recall is
  # measured against the true top-k, not against every id in the list.

  # Relative score tolerance for calling two scores tied. Unset (default) =
  # derived from the collection's stored datatype, probed at startup:
  # float32 -> 5e-6, float16 -> 2e-3. A collection created without an explicit
  # datatype reports none and takes the float32 value, since that is Qdrant's
  # default storage; only an unreadable or unrecognized one gets 2e-3.
  # See docs/storm/recall.md for the measurements behind those.
  # tie_epsilon: 2e-3
  # Return each hit's full payload (default false = ids/scores only). Turn on
  # when the modeled production traffic fetches payloads — payload reads and
  # response bytes are real cost the benchmark otherwise understates. (No-op on
  # milvus, which doesn't persist payload; on elastic it returns `_source`
  # excluding the vector, to match Qdrant's payload-only fetch.)
  # with_payload: true

  # Server-side search tuning — the SHAPE IS PER-BACKEND and validated (an
  # unknown/foreign key is rejected). Omit to use the backend's own defaults.
  #   qdrant:  { hnsw_ef: 128, exact: false, quantization: { rescore: true, oversampling: 2.0 } }
  #   milvus:  { ef: 128 }       # HNSW; or { nprobe: 32 } for IVF — not both
  #   elastic: { num_candidates: 128 }   # per-shard HNSW candidate pool, must be >= top_k
  # search_params:
  #   hnsw_ef: 128
  source:
    # Query vectors — a parquet file (or dir) at a local path or s3:// URI, read
    # via DuckDB. Each row's `column` is one query vector.
    uri: s3://qdrant--vectorforge/fiqa/bge-m3/queries.parquet
    column: dense_embedding
    limit: 5000                     # load this many vectors and cycle through them
    # For recall@k, name a list<string> column of known-correct top-k ids (e.g.
    # `nova bf`'s `hit_ids`), read from the same row as the vector. Ids are
    # compared as strings — works across Qdrant/Milvus/Elastic identically.
    # ground_truth_column: hit_ids
    # The matching score column (`nova bf`'s `hit_scores`). Optional, and only
    # meaningful alongside `ground_truth_column`. With it, storm can tell a
    # genuine miss from a TIE — several documents sharing the ground truth's
    # k-th score are all equally correct — and reports recall as a RANGE
    # instead of a single, unfairly harsh number.
    # ground_truth_score_column: hit_scores

# Per-worker load shape (replicated across the fleet).
load:
  # Closed-loop (default, `rps` unset): hold `concurrency` requests in flight for
  # `duration_s` and measure the max throughput sustainable at that depth.
  concurrency: 32
  duration_s: 60

  # How many query vectors go in each dispatch (one query_batch RPC per
  # dispatch). 1 (default) is not a special case — every dispatch is a batch,
  # just of size 1 by default. Raise this to measure Qdrant's native batched
  # query throughput instead of one-vector-per-round-trip.
  # batch_size: 8

  # Open-loop paced: uncomment `rps` to launch a batch dispatch on a fixed
  # 1/rps schedule instead, with `concurrency` as the in-flight ceiling. Use
  # this to measure latency at a KNOWN offered rate (avoids coordinated
  # omission); raise rps to find the knee. Note `rps` paces *dispatches*, not
  # individual queries — actual query throughput is `rps * batch_size` (see
  # the `qps` field in the printed summary).
  # rps: 500

# Optional: per-dispatch TIME-SERIES output, for plotting transient behavior
# (acute load, the cluster re-optimizing mid-run) that the end-of-run summary
# collapses away. One raw row per dispatch, in completion order:
#   t_s (seconds since run start), latency_ms, ok, recalls
# Deliberately unaggregated — bucket/smooth downstream (pandas/polars/duckdb).
# Omit the section for summary-only (default). `path: "-"` streams to stdout —
# fine interactively, but it breaks `--json` consumers like `nova sweep`.
# report:
#   format: csv                     # csv | jsonl
#   path: storm_ts.csv
