[project]
name = "supernova"
version = "0.1.0"
description = "Stream massive datasets, embed at scale, store as parquet in S3."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # true core -- needed by all workers and local dev
    "pyarrow",
    "numpy",
    "pyyaml",
    "tqdm",
    "boto3",
    # 1.5+ ships the Storage Buckets API (create_bucket, batch_bucket_files,
    # sync_bucket, list_bucket_tree, copy_files, hf://buckets/... paths).
    "huggingface_hub>=1.5",
    "click>=8.1",
]

[project.optional-dependencies]
# ML pipeline -- embed workers
embed = [
    # Pinned: aiobotocore 3.5.0 (released 2026-04-21) might have introduced a regression
    # where streaming a sync file handle as Body=f to put_object hangs and
    # eventually fails with aiohttp ClientConnectionResetError("Cannot write
    # to closing transport"). Pin until we either move the upload off
    # aiobotocore or upstream lands a fix. aiohttp pinned for the same
    # reason -- 3.13.5 ships the chunked-write Task path that interacts badly
    # with aiobotocore <3.5 too.
    "aiobotocore<3.5",
    "aiohttp<3.13.5",
    "tiktoken>=0.12.0",
    "openai",
    "sentence-transformers",
    "torch",
    "transformers",
    "FlagEmbedding",
    "einops>=0.8.2",
    "fastembed",
    # Rust client for multi-part parallel HF downloads. Activated by
    # HF_HUB_ENABLE_HF_TRANSFER=1; without the env var, huggingface_hub
    # falls back to single-stream HTTP. Worth the install on every embed
    # worker because the parquet source's prefetch path otherwise tops
    # out at ~10 MB/s on a 10 Gbps NIC.
    "hf_transfer",
]
# Pipeline infra only -- partition workers (no ML models, no fastembed)
partition = [
    "aiobotocore<3.5",
    "aiohttp<3.13.5",
    "tiktoken>=0.12.0",
    "hf_transfer",
]
# Vector store loading -- loader workers
load = [
    "duckdb>=1.5.1",
    "qdrant-client>=1.9.0",
]
# Recall evaluation -- brute-force nearest-neighbor search (GPU)
eval = [
    "torch",
]
# Distributed job dispatch -- local / Hetzner only, never on workers
dist = [
    "skypilot[aws]",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["supernova*"]

[project.scripts]
nova = "supernova.cli.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff>=0.15.12",
    "zensical",
]
