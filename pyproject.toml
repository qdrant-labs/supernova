[project]
name = "vectorforge"
version = "0.1.0"
description = "Stream massive datasets, embed at scale, store as parquet in S3."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # true core -- needed by all workers and local dev
    "pyarrow",
    "numpy",
    "pyyaml",
    "tqdm",
    "boto3",
    "huggingface_hub",
    "click>=8.1",
]

[project.optional-dependencies]
# ML pipeline -- embed workers
embed = [
    "datasets",
    "aiobotocore",
    "tiktoken>=0.12.0",
    "openai",
    "sentence-transformers",
    "torch",
    "transformers<5",
    "FlagEmbedding",
    "einops>=0.8.2",
    "fastembed",
]
# Pipeline infra only -- partition workers (no ML models, no fastembed)
partition = [
    "datasets",
    "aiobotocore",
    "tiktoken>=0.12.0",
]
# Vector store loading -- loader workers
load = [
    "duckdb>=1.5.1",
    "qdrant-client>=1.9.0",
]
# Recall evaluation -- brute-force nearest-neighbor search (GPU)
eval = [
    "torch",
]
# Distributed job dispatch -- local / Hetzner only, never on workers
dist = [
    "skypilot[aws]",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vectorforge*", "cli*"]

[project.scripts]
vf = "cli.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "zensical",
]
