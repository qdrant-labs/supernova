[project]
name = "vectorforge"
version = "0.1.0"
description = "Stream massive datasets, embed at scale, store as parquet in S3."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets",
    "pyarrow",
    "aiobotocore",
    "httpx",
    "openai",
    "cohere",
    "pyyaml",
]

[project.scripts]
vectorforge = "scripts.run_pipeline:main"

[tool.uv]
dev-dependencies = [
    "pytest",
    "pytest-asyncio",
]
