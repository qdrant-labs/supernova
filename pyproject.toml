[project]
name = "vectorforge"
version = "0.1.0"
description = "Stream massive datasets, embed at scale, store as parquet in S3."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets",
    "pyarrow",
    "aiobotocore",
    "httpx",
    "openai",
    "cohere",
    "pyyaml",
    "tiktoken>=0.12.0",
    "tqdm",
    "huggingface_hub",
    "duckdb>=1.5.1",
    "sentence-transformers",
    "torch",
    "transformers<5",
    "qdrant-client>=1.9.0",
    "boto3"
]

[tool.setuptools.packages.find]
include = ["vectorforge*"]

[project.scripts]
vectorforge = "scripts.run_pipeline:main"
vectorforge-load = "scripts.run_loader:main"
vectorforge-load-distributed = "scripts.run_dispatch:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]
