[project]
name = "nova-cli"
version = "3"
description = "Git-style dispatcher for the nova/supernova toolset: `nova <cmd>` runs `nova-<cmd>`."
requires-python = ">=3.9"
# Intentionally zero dependencies: the dispatcher must install instantly
# anywhere. Heavy commands (e.g. nova-embed with pytorch) are separate packages
# under python/.
dependencies = []

[project.scripts]
nova = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli"]
