# Local observability stack for supernova metrics: TimescaleDB (the sink) +
# Grafana (pre-wired to it). `docker compose up -d`, point SN_METRICS_DB_URL at
# the db, and run demo_emit.py to watch samples stream in.
#
# Local story only. On an EC2 fleet, workers can't reach this container — they
# write to Neon instead (same backend, different DSN) and Grafana points at Neon.
# SkyPilot's own Prometheus is a separate, optional fleet-health datasource and
# is not part of this stack.
services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_PASSWORD: supernova
      POSTGRES_DB: supernova
    ports:
      - "5432:5432"
    volumes:
      - tsdb-data:/var/lib/postgresql/data

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: supernova
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - timescaledb

  # Scrapes Qdrant Cloud's /metrics + /sys_metrics so the server's own view can
  # overlay the client load-test metrics. Opt-in: `docker compose --profile qdrant up`.
  # Reuses QDRANT_URL + QDRANT_API_KEY from your env; the key is written to a file
  # at start (Bearer auth) so it never lands in the repo. Prometheus can't expand
  # env vars in its config, hence the small render-at-start shell step.
  prometheus:
    image: prom/prometheus:latest
    profiles: ["qdrant"]
    environment:
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prom-data:/prometheus
    ports:
      - "9090:9090"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        printf '%s' "$$QDRANT_API_KEY" > /tmp/qdrant_key
        HOST=$$(printf '%s' "$$QDRANT_URL" | sed -e 's#^[a-z]*://##' -e 's#/.*##')
        case "$$HOST" in *:*) ;; *) HOST="$$HOST:443" ;; esac
        sed "s#__QDRANT_HOST__#$$HOST#g" /etc/prometheus/prometheus.tmpl.yml > /tmp/prometheus.yml
        exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus

volumes:
  tsdb-data:
  grafana-data:
  prom-data: