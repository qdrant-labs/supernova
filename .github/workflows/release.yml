name: Release to PyPI

# Publishes supernova to PyPI when a version tag is pushed (e.g. `v0.1.0`),
# using PyPI Trusted Publishing (OIDC) — no API tokens stored in the repo.
#
# One-time PyPI setup — the `supernova` project already exists, so register a
# project-scoped Trusted Publisher. (Do NOT use "Add a pending publisher" — that
# is only for project names that don't exist yet; using it on an existing
# project fails with `invalid-pending-publisher: project already exists`.)
#   pypi.org -> Your projects -> supernova -> Manage -> Publishing ->
#   "Add a new publisher" (GitHub):
#     Owner:             qdrant-labs
#     Repository name:   supernova
#     Workflow name:     release.yml
#     Environment name:  pypi
# After that, `git tag vX.Y.Z && git push origin vX.Y.Z` ships it
# (bump pyproject `version` to match the tag first).

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  pypi-publish:
    name: Build & publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/supernova
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build sdist + wheel
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
