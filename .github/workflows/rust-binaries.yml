name: rust-binaries

# Pre-build the Rust tools (nova-load, nova-storm) so workers download a binary
# instead of compiling duckdb's bundled C++ from scratch on every ephemeral node.
#
# Triggers:
#   - push to master  -> rolling `dev` pre-release (overwritten each merge)
#   - tag v*          -> the matching versioned release
#
# Assets are named `<bin>-<target>` (raw binaries) and attached to the release.
# Workers curl the one matching `uname -m`; `cargo binstall` also resolves them
# via [package.metadata.binstall] in each crate's Cargo.toml.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: 

permissions:
  contents: write  # create/update releases

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm   # native arm64 runner — no cross-compile
    # Build on the OLDEST Ubuntu we support, NOT ubuntu-latest. glibc is only
    # backward-compatible: a binary linked against 24.04's glibc (2.39) won't run
    # on an older worker ("GLIBC_2.38 not found"). 22.04 ships glibc 2.35, which
    # runs on 22.04+ workers. If your EC2 AMI is older still (Amazon Linux 2,
    # Ubuntu 20.04), either pin the worker AMI to 22.04+ or switch to
    # cargo-zigbuild targeting an old glibc / a musl static build.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup update stable && rustup default stable

      # duckdb's `bundled` feature compiles a large C++ amalgamation; the runners
      # have a C++ toolchain, but cmake/build-essential makes it reliable.
      # protobuf-compiler: the milvus backend's SDK generates gRPC stubs from
      # .proto at build time (tonic-build), which needs `protoc` on PATH.
      - name: Build deps
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake protobuf-compiler

      # nova-load ships with all load backends so the fleet binary can target any
      # of them (qdrant/elastic/milvus); the features are off by default in local
      # dev builds. nova-storm has no extra features.
      - name: Build (release)
        run: |
          cargo build --release -p nova-storm
          cargo build --release -p nova-load --features elastic,milvus

      - name: Stage assets as <bin>-<target>
        run: |
          mkdir -p dist
          for bin in nova-load nova-storm; do
            cp "target/release/$bin" "dist/$bin-${{ matrix.target }}"
          done

      # Versioned release on a tag.
      - name: Release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

      # Rolling pre-release on master so un-tagged code is testable on a fleet.
      - name: Release (rolling dev)
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          prerelease: true
          files: dist/*
