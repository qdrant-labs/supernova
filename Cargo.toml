[workspace]
resolver = "3"
members = [
    "crates/nova-storm",
    "crates/nova-load",
    "crates/nova-inspect",
    "crates/nova-web",
]
version = "0.0.9"

# Shrink debug-build artifacts (the `target/` dir was filling the disk). These are
# profile keys, so they must live under [profile.*], not [workspace].
[profile.dev]
debug = 0                      # no debug symbols — the biggest artifact-size win
split-debuginfo = "unpacked"   # keep any remaining symbols out of the main binary

[workspace.dependencies]
async-trait="0.1.89"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
qdrant-client = "1.19.0"
url = "2"
tempfile = "3.27.0"
object_store = { version = "0.11", features = ["aws"] }
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs"] }
thiserror = "2"
duckdb = { version = "1", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.18"

# Optional load backends (feature-gated in nova-load; off by default). The ES
# client only ships pre-release builds — pin one that matches your cluster major
# (8.x here; use a 9.x-alpha for ES 9). `milvus` is the unofficial community SDK.
elasticsearch = "=8.15.0-alpha.1"
# The maintained community SDK; its lib name is `milvus`, so `use milvus::…` is
# unchanged. (The similarly-named `milvus` crate is a different, unbuildable one.)
milvus = { package = "milvus-sdk-rust", version = "0.1.0" }


# dev dependencies for workspace
[workspace.dev-dependencies]
rstest = "0.26.1"
