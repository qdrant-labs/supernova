[package]
# The user-facing `nova load` command. This is a thin front controller: it
# reads only `vectorstore.type` from the config, then `exec`s the matching
# backend executable (`nova-load-<type>`, e.g. `nova-load-qdrant`) with the
# original args unchanged. The real work lives in backends/nova-load/*.
name = "nova-load"
version = "0.0.8"
edition = "2024"
repository = "https://github.com/qdrant-labs/supernova"

[[bin]]
name = "nova-load"
path = "src/main.rs"

# `cargo binstall nova-load` fetches the prebuilt shim from each `v*` release
# (see .github/workflows/rust-binaries.yml). Matches the asset naming there.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ binary-ext }"
pkg-fmt = "bin"

[dependencies]
# Shared shim front-controller logic (config-type dispatch + exec). See
# commands/nova-shim; keeps this shim identical to the nova-storm shim.
nova-shim = { path = "../nova-shim" }
