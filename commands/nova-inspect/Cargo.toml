[package]
name = "nova-inspect"
version = "0.0.8"
edition = "2024"
repository = "https://github.com/qdrant-labs/supernova"

[[bin]]
name = "nova-inspect"
path = "src/main.rs"

# No binstall/prebuilt binary: this is a local inspection tool (run on your
# laptop / dispatch box), never a fleet workload — so it's only ever built from
# source via `make inspect` (cargo install). Unlike nova-load/nova-storm, it
# doesn't need to be downloaded onto cold workers.

[dependencies]
clap = { workspace = true }
# `bundled` already includes parquet. httpfs (for s3://) is auto-loaded at
# runtime by DuckDB on first S3 access — no extra build-time feature needed.
duckdb = { workspace = true }
