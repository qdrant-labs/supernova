[package]
name = "nova-storm"
version = "0.0.9"
edition = "2024"
repository = "https://github.com/qdrant-labs/supernova"

[[bin]]
name = "nova-storm"
path = "src/main.rs"

# `cargo binstall nova-storm` fetches the prebuilt binary from the matching
# `v*` release (see .github/workflows/rust-binaries.yml) instead of compiling.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ binary-ext }"
pkg-fmt = "bin"

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
indicatif = { workspace = true }

# Query vectors are read from parquet (local or s3://) via DuckDB.
duckdb = { workspace = true }

# Target backends. Qdrant is always built in; elastic/milvus are optional (off by
# default), mirroring nova-load's feature gating.
qdrant-client = { workspace = true }
elasticsearch = { workspace = true, optional = true }
url = { workspace = true, optional = true }
milvus = { workspace = true, optional = true }
# The milvus target reads index-build progress + issues cosine searches over
# Milvus's REST API (the Rust SDK's MetricType enum has no COSINE); pulled in
# only with the `milvus` feature.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

[features]
default = []
elastic = ["dep:elasticsearch", "dep:url"]
milvus = ["dep:milvus", "dep:reqwest"]

[dev-dependencies]
tempfile = { workspace = true }
