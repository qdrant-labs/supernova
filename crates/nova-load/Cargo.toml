[package]
name = "nova-load"
version = "0.0.7"
edition = "2024"
repository = "https://github.com/qdrant-labs/supernova"

[[bin]]
name = "nova-load"
path = "src/main.rs"

# `cargo binstall nova-load` fetches the prebuilt binary the rust-binaries.yml
# workflow attaches to each `v*` release (named `<bin>-<target>`), instead of
# compiling. Matches the asset naming in that workflow.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ binary-ext }"
pkg-fmt = "bin"

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }
object_store = { workspace = true }
futures = { workspace = true }
indicatif = { workspace = true }

# Metrics sink (postgres compiled in so one binary serves stdout + postgres
# configs; the backend is chosen at runtime from metrics.type).
# nova-metrics = { workspace = true, features = ["postgres"] }

# feature-specific dependencies
qdrant-client = { workspace = true }
duckdb = { workspace = true }

# Optional load backends — off by default, enabled with `--features elastic,milvus`.
elasticsearch = { workspace = true, optional = true }
url = { workspace = true, optional = true }
milvus = { workspace = true, optional = true }

[features]
default = []
elastic = ["dep:elasticsearch", "dep:url"]
milvus = ["dep:milvus"]

[dev-dependencies]
rstest = "0.26.1"
