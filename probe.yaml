resources:
  accelerators: A10G:1
  cloud: aws
  use_spot: true
run: nvidia-smi && python -c "import torch; print(torch.cuda.is_available(), torch.version.cuda)

sky exec gpu-probe 'curl -LsSf https://astral.sh/uv/install.sh | sh && mkdir -p /tmp/t && cd /tmp/t && cat > pyproject.toml <<"EOF"
[project]
name = "t"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch"]
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
EOF
$HOME/.local/bin/uv sync && $HOME/.local/bin/uv run python -c "import torch; print(torch.__version__, torch.cuda.is_available(), torch.version.cuda)"'