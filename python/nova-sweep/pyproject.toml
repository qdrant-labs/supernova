[project]
name = "nova-sweep"
version = "0.0.1"
description = "Parameter sweep orchestrator for the supernova toolset — drives nova-load/nova-storm across a matrix of index/search configs."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
# Controller-side only, no heavy compute of its own: orchestrates nova-load /
# nova-storm subprocesses. qdrant-client is needed only for the pre-flight
# collection-exists check — nova-load's own CLI has no bare
# existence query.
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "click>=8.1",
    "pyarrow",
    "qdrant-client",
]

[project.optional-dependencies]
dev = ["pytest"]

# Exposes `nova-sweep` on PATH so `nova sweep ...` dispatches here.
[project.scripts]
nova-sweep = "nova_sweep.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nova_sweep"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
