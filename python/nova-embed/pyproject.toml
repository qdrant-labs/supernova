[project]
name = "nova-embed"
version = "0.0.8"
description = "Embedding generation for the supernova toolset — stream datasets, embed at scale, write parquet."
requires-python = ">=3.11"
# Base deps are light enough to import the config layer and the CLI scaffolding.
# The heavy ML stack (torch, sentence-transformers, …) is in the `embed` extra,
# installed only on embedding workers.
dependencies = [
    "pydantic>=2",
    "pyarrow",
    "numpy",
    "pyyaml",
    "tqdm",
    "boto3",
    "huggingface_hub>=1.5",
    "click>=8.1",
]

[project.optional-dependencies]
# The actual embedding workers. `nova embed` won't run without these.
embed = [
    # Generic object-store writer (S3/GCS/Azure + S3-compatible) — Rust-backed,
    # async, multipart. Its boto3 credential provider reuses the base `boto3` dep.
    "obstore>=0.11",
    "tiktoken>=0.12.0",
    "openai",
    "sentence-transformers",
    "torch",
    # Unpinned: do NOT cap `transformers<5`. huggingface-hub 1.0 split the stack —
    # transformers 4.x needs hub<1.0, but sentence-transformers/fastembed/datasets
    # need hub>=1.0, so a `<5` pin is unsatisfiable. If a specific trust_remote_code
    # model breaks on transformers 5, prefer a model without custom code (e.g.
    # BAAI/bge-m3) rather than pinning the whole stack back.
    "transformers",
    "FlagEmbedding",
    "einops>=0.8.2",
    "fastembed",
    "hf_transfer",
    # Image-modality decoding (nova_embed.media.image → PIL canonical form).
    "pillow",
    # Required by several VL model processors (e.g. Qwen3-VL) even for stills.
    "torchvision",
]
# The vllm backend (modality: multimodal, or high-throughput text). Its own
# extra, not part of `embed`: vLLM is Linux+GPU only — the platform marker
# keeps macOS/other resolution from ever considering it (there are no darwin
# wheels; without the marker uv's universal resolve digs up a 2023 sdist and
# tries to compile it against CUDA).
vllm = [
    "vllm>=0.11; sys_platform == 'linux'",
    "pillow",
]

# Exposes `nova-embed` on PATH, so `nova embed ...` dispatches here just like a
# Rust `nova-<cmd>` binary would.
[project.scripts]
nova-embed = "nova_embed.cli.run_embedder:embed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nova_embed"]

[tool.pytest.ini_options]
# src-layout: make `nova_embed` importable in tests without an editable install.
pythonpath = ["src"]
testpaths = ["tests"]
