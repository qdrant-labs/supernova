[project]
name = "nova-opt"
version = "0.0.1"
description = "Cost-aware, recall-constrained Bayesian-optimization tuner for vector databases — replaces nova-sweep's exhaustive grids with an experiment planner that maximizes QPS/latency Pareto improvement per unit marginal rebuild cost."
requires-python = ">=3.11"
# Controller-side only, like nova-sweep: real evaluations happen in
# nova-load / nova-storm subprocesses. The ML stack here (xgboost,
# scikit-learn) is for the recall-feasibility classifier and the GP
# surrogates, both of which run on the controller.
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "click>=8.1",
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "xgboost>=2",
    "qdrant-client",
]

[project.optional-dependencies]
dev = ["pytest"]

# Exposes `nova-opt` on PATH so `nova opt ...` dispatches here.
[project.scripts]
nova-opt = "nova_opt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nova_opt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
