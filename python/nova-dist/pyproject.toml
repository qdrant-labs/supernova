[project]
name = "nova-dist"
version = "0.0.3"
description = "Distributed orchestration for the supernova toolset — fan embed/load/storm across a SkyPilot fleet."
requires-python = ">=3.11"
# This package IS the SkyPilot orchestrator, so the SDK is a core dep (not an
# extra). Installed only on the controller (your laptop / a dispatch box) —
# never on workers, which just run the tool binaries.
dependencies = [
    "skypilot[aws]",
    "click>=8.1",
    "pyyaml",
]

# `nova dist ...` dispatches here (the git-style `nova` execs `nova-dist`).
[project.scripts]
nova-dist = "nova_dist.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nova_dist"]
