[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "rust_fetch"
version = "0.1.0"
description = "High-throughput native S3 range downloader writing into caller-provided buffers (GIL released)"
requires-python = ">=3.11"
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: Implementation :: CPython"]

[tool.maturin]
features = ["python"]
python-source = "python"
module-name = "rust_fetch._rust_fetch"
